name: Build arm64 images for N1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'n1-arm64'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            context: ./backend
            image: caiyun-backend
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: .
            image: caiyun-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          build-args: |
            TARGETARCH=arm64
            GOPROXY=https://goproxy.cn,direct
            VERSION=n1
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/caiyun/${{ matrix.image }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/caiyun/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
